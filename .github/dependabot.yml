version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - ng-packagr
      npm:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - ng-packagr

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

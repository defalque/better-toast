# Library build + tests, and website production build, on the workspace Angular version (22).
# @lucide/angular (website-only) does not yet declare Angular 22 peers; install uses --legacy-peer-deps.
# Angular 21 is still a declared peer of better-toast; a 21 CI job is a follow-up.

name: better-toast CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build library (ng-packagr)
        run: npx ng build better-toast

      - name: Unit tests (better-toast)
        run: npm run test:better-toast

      - name: Build website (production)
        run: npm run build:website
